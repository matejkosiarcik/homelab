- name: Sync secrets
  hosts: servers
  tasks:
    - name: Ping
      ansible.builtin.ping:

    ## Sync secrets ##

    - name: Sync SOPS config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../secrets/.sops.yml"
        dest: "{{ ansible_facts['env']['HOME'] }}/git/homelab/secrets/.sops.yml"

    - name: Sync private key
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../secrets/key.txt"
        dest: "{{ ansible_facts['env']['HOME'] }}/git/homelab/secrets/key.txt"

    - name: Sync encrypted secrets
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../secrets/secrets.enc.yml"
        dest: "{{ ansible_facts['env']['HOME'] }}/git/homelab/secrets/secrets.enc.yml"
