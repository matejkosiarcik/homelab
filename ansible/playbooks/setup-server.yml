- name: Setup OS
  hosts: servers
  tasks:
    - name: Ping
      ansible.builtin.ping:

    ## APT ##

    - name: Update APT index
      when: ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian'
      become: true
      ansible.builtin.apt:
        update_cache: true

    - name: Install base APT packages
      register: apt_packages
      when: ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian'
      become: true
      ansible.builtin.apt:
        pkg:
          - age
          - apache2-utils # Maybe remove this in the future
          - argon2
          - bash
          - btop
          - build-essential
          - ca-certificates
          - cron
          - curl
          - dnsutils
          - firmware-linux-nonfree
          - git
          - golang
          - htop
          - jq
          - lm-sensors
          - locales
          - lshw
          - lsof
          - moreutils
          - openssh-server
          - openssl
          - pipx
          - psmisc
          - python-is-python3
          - python3
          - python3-pip
          - python3-venv
          - rfkill
          - rsync
          - smartmontools
          - tmux
          - udisks2
          - unattended-upgrades
          - wget
          # - s-tui
      # Note: also install "nvtop", but this requires contrib and non-free packages in /etc/apt/sources.list

    - name: Install x64 APT packages
      when: ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian' and ansible_facts['architecture'] == 'x86_64'
      become: true
      ansible.builtin.apt:
        pkg:
          - intel-gpu-tools # contains `intel_gpu_top`
          - linux-cpupower
          - linux-headers-amd64
          - vainfo

    - name: Install arm64 APT packages
      when: ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian' and ansible_facts['architecture'] == 'aarch64'
      become: true
      ansible.builtin.apt:
        pkg:
          - linux-headers-arm64

    # Just a note, this can take a long time, especially on first run
    - name: Upgrade APT packages
      when: ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian'
      become: true
      ansible.builtin.apt:
        upgrade: true
        autoclean: true
        autoremove: true

    ## General config ##

    - name: Configure Shell
      register: shell_config_files
      ansible.builtin.blockinfile:
        path: "{{ item.path }}"
        marker: "# {mark} ANSIBLE #"
        insertafter: EOF
        create: true
        prepend_newline: true
        block: "{{ item.block }}"
      loop:
        - path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
          block: |
            # Homelab config
            export HOMELAB_ENV='prod'

            # Docker config
            export COMPOSE_BAKE='true'
            export DOCKER_BUILDKIT='1'
            export COMPOSE_DOCKER_CLI_BUILD='1'

            # NodeJS config
            export NODE_NO_WARNINGS='1'

            # Pipx programs
            export PATH="$PATH:$HOME/.local/bin"

            # Go programs
            export PATH="$PATH:$HOME/go/bin"

            # Task runner
            eval "$(task --completion bash)"
        - path: "{{ ansible_facts['env']['HOME'] }}/.profile"
          block: |
            # Homelab config
            export HOMELAB_ENV='prod'

            # Docker config
            export COMPOSE_BAKE='true'
            export DOCKER_BUILDKIT='1'
            export COMPOSE_DOCKER_CLI_BUILD='1'

            # NodeJS config
            export NODE_NO_WARNINGS='1'

            # Pipx programs
            export PATH="$PATH:$HOME/.local/bin"

            # Go programs
            export PATH="$PATH:$HOME/go/bin"

    # This prevents problems with inotify and open file descriptors
    - name: Raise inotify limits
      when: ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian'
      register: inotify_limits
      become: true
      ansible.builtin.lineinfile:
        path: /usr/lib/sysctl.d/50-default.conf
        insertafter: EOF
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - regexp: '^fs\.inotify\.max_user_instances ?='
          line: "fs.inotify.max_user_instances = 65536"
        - regexp: '^fs\.file\-max ?='
          line: "fs.file-max = 65536"

    # Raspberry PI by default doesn't allow monitoring for individual containers
    - name: Allow docker memory monitoring
      register: docker_memory_monitoring
      when: ansible_facts['system'] == 'Linux' and 'raspberry' in ansible_facts['hostname']
      changed_when: "'CHANGED' in docker_memory_monitoring.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if [ ! -f '/boot/firmware/cmdline.txt' ]; then
          printf 'File '/boot/firmware/cmdline.txt' not found' >&2
          exit 1
        fi
        before_sha="$(shasum '/boot/firmware/cmdline.txt')"

        # TODO: Change this to lineinfile to change the lines instead of appending them
        if ! grep 'cgroup_enable=cpuset' <'/boot/firmware/cmdline.txt' >/dev/null; then
          printf ' cgroup_enable=cpuset' | sudo tee --append '/boot/firmware/cmdline.txt' >/dev/null
        fi
        if ! grep 'cgroup_enable=memory' <'/boot/firmware/cmdline.txt' >/dev/null; then
          printf ' cgroup_enable=memory' | sudo tee --append '/boot/firmware/cmdline.txt' >/dev/null
        fi
        if ! grep 'cgroup_memory=1' <'/boot/firmware/cmdline.txt' >/dev/null; then
          printf ' cgroup_memory=1' | sudo tee --append '/boot/firmware/cmdline.txt' >/dev/null
        fi

        after_sha="$(shasum '/boot/firmware/cmdline.txt')"
        if [ "$before_sha" != "$after_sha" ]; then
          printf 'CHANGED\n'
        fi

    - name: Reboot
      when: inotify_limits.changed or docker_memory_monitoring.changed
      throttle: 1
      ansible.builtin.reboot:
        reboot_command: sudo reboot

    ## SSH Config ##

    # Disable password authentication
    - name: SSH config
      when: ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian'
      register: ssh_config
      become: true
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        insertafter: EOF
        regexp: '^#*\s*PasswordAuthentication\s+(?:yes|no)'
        line: "PasswordAuthentication no"

    - name: Restart SSH server
      register: ssh_restart
      when: ansible_facts['system'] == 'Linux' and 'raspberry' in ansible_facts['hostname'] and ssh_config.changed
      changed_when: "'CHANGED' in ssh_restart.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        sudo service ssh restart
        printf 'CHANGED\n'

    ## Git Config ##

    - name: Git config
      register: git_config
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
        marker: "# {mark} ANSIBLE #"
        insertafter: EOF
        create: true
        prepend_newline: true
        block: |
          [remote "origin"]
            prune = true
          [pull]
            rebase = true

    ## Log2Ram ##

    - name: Install log2ram
      register: log2ram_install
      when: ansible_facts['system'] == 'Linux' and 'raspberry' in ansible_facts['hostname']
      changed_when: "'CHANGED' in log2ram_install.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if ! command -v log2ram >/dev/null 2>&1; then
          echo "deb [signed-by=/usr/share/keyrings/azlux-archive-keyring.gpg] http://packages.azlux.fr/debian/ bookworm main" \
            | sudo tee /etc/apt/sources.list.d/azlux.list >/dev/null
          sudo curl https://azlux.fr/repo.gpg -o /usr/share/keyrings/azlux-archive-keyring.gpg
          sudo apt-get update
          sudo apt-get install --yes log2ram
          # Modify settings (disable email)
          sed 's~MAIL=true~MAIL=false~' </etc/log2ram.conf | sudo sponge /etc/log2ram.conf
          printf 'CHANGED\n'
        fi

    - name: Reboot
      when: log2ram_install.changed
      throttle: 1
      ansible.builtin.reboot:
        reboot_command: sudo reboot

    - name: Verify log2ram installation
      when: log2ram_install.changed
      changed_when: "False"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        systemctl status log2ram | grep 'Active: active' >/dev/null 2>&1

    ## NodeJS ##

    - name: Install NodeJS
      register: install_nodejs
      when: ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian'
      changed_when: "'CHANGED' in install_nodejs.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
          exit 0
        fi

        if [ -e nodesource_setup.sh ]; then
          rm -f nodesource_setup.sh
        fi

        curl -fsSL https://deb.nodesource.com/setup_lts.x -o nodesource_setup.sh
        sudo -E bash nodesource_setup.sh
        rm -f nodesource_setup.sh
        sudo apt-get install -y nodejs
        printf 'CHANGED\n'
        node --version
        npm --version

    - name: Configure NPM
      register: npm_config_file
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.npmrc"
        marker: "; {mark} ANSIBLE ;"
        insertafter: EOF
        create: true
        prepend_newline: true
        block: |
          fetch-retries=5
          fetch-retry-factor=10
          fetch-retry-maxtimeout=60000
          fetch-retry-mintimeout=1000
          ignore-scripts=true
          min-release-age=1
        # TODO: Also add: registry=https://npm-cache.matejhome.com

    - name: Update NPM packages
      become: true
      community.general.npm:
        global: true
        state: latest

    ## Go ##

    - name: Install Task
      register: install_task
      changed_when: "'CHANGED' in install_task.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if command -v task >/dev/null 2>&1; then
          exit 0
        fi

        go install github.com/go-task/task/v3/cmd/task@latest
        printf 'CHANGED\n'

    - name: Install SOPS
      register: install_sops
      changed_when: "'CHANGED' in install_sops.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if command -v sops >/dev/null 2>&1; then
          exit 0
        fi

        go install github.com/getsops/sops/v3/cmd/sops@latest
        printf 'CHANGED\n'

    ## Python ##

    - name: Install yq
      register: install_yq
      community.general.pipx:
        name: yq

    - name: Update Pipx packages
      register: update_pipx
      changed_when: "'No packages upgraded' not in update_pipx.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        pipx upgrade-all

    ## Docker ##

    - name: Install docker
      register: docker_install
      when: ansible_facts['system'] == 'Linux'
      changed_when: "'CHANGED' in docker_install.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if ! command -v docker >/dev/null 2>&1; then
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) \
            signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          # sudo groupadd docker # Already exists
          sudo usermod -aG docker "$(whoami)"
          printf 'CHANGED\n'
        fi

    - name: Reboot
      when: ansible_facts['system'] == 'Linux' and docker_install.changed
      throttle: 1
      ansible.builtin.reboot:
        reboot_command: sudo reboot

    - name: Verify docker installation
      when: ansible_facts['system'] == 'Linux' and docker_install.changed
      changed_when: "False"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        docker run hello-world

    - name: Start docker on startup
      register: docker_startup
      when: ansible_facts['system'] == 'Linux' and docker_install.changed
      changed_when: "'CHANGED' in docker_startup.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if ! sudo systemctl status docker.service >/dev/null 2>&1; then
          sudo systemctl enable docker.service
          printf 'CHANGED\n'
        fi
        if ! sudo systemctl status containerd.service >/dev/null 2>&1; then
          sudo systemctl enable containerd.service
          printf 'CHANGED\n'
        fi

    - name: Docker config
      when: ansible_facts['system'] == 'Linux'
      register: docker_config
      become: true
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "log-driver": "local",
            "log-opts": {
              "max-size": "100m"
            },
            "default-address-pools": [
              {
                "base" : "172.16.0.0/12",
                "size" : 26
              }
            ],
            "registry-mirrors": [
              "https://docker-cache-dockerhub.matejhome.com"
            ]
          }

    - name: Restart docker
      when: ansible_facts['system'] == 'Linux' and docker_config.changed
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        sudo service docker restart

    # This is necessary, otherwise sometimes the network addresses we want to bind to are not setup yet
    - name: Throtlle docker service start
      register: docker_throttle
      become: true
      when: ansible_facts['system'] == 'Linux'
      changed_when: "'CHANGED' in docker_throttle.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if [ ! -d /etc/systemd/system/docker.service.d ]; then
          sudo mkdir /etc/systemd/system/docker.service.d
          printf 'CHANGED\n'
        fi
        before_sha="$(shasum /etc/systemd/system/docker.service.d/override.conf || true)"
        printf '[Service]\nExecStartPre=/bin/sleep 10\n' | sudo sponge /etc/systemd/system/docker.service.d/override.conf
        after_sha="$(shasum /etc/systemd/system/docker.service.d/override.conf)"
        if [ "$before_sha" != "$after_sha" ]; then
          printf 'CHANGED\n'
        fi

    ## Other ##

    - name: Configure sensors
      when: apt_packages.changed
      changed_when: "True"
      ansible.builtin.shell: |
        set -eufo pipefail
        (yes || true) | sudo sensors-detect

    # TODO: Fix this for real
    - name: Setup locale
      register: setup_locale
      when: ansible_facts['system'] == 'Linux'
      changed_when: "'CHANGED' in setup_locale.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        sudo locale-gen en_US.UTF-8
        sudo localedef -i en_US -f UTF-8 en_US.UTF-8
        before_sha="$(shasum '/etc/default/locale')"
        printf 'LANGUAGE=en_US.UTF-8\nLC_ALL=en_US.UTF-8\nLANG=en_US.UTF-8\nLC_CTYPE=en_US.UTF-8\n' | sudo tee '/etc/default/locale' >/dev/null
        after_sha="$(shasum '/etc/default/locale')"
        if [ "$before_sha" != "$after_sha" ]; then
          printf 'CHANGED\n'
        fi

    - name: Reboot
      when: setup_locale.changed
      throttle: 1
      ansible.builtin.reboot:
        reboot_command: sudo reboot

    - name: Create cron log directory
      register: create_cron_log_dir
      changed_when: "'CHANGED' in create_cron_log_dir.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if [ ! -e "$HOME/.log" ]; then
          mkdir -p "$HOME/.log"
          printf 'CHANGED\n'
        fi

    ## Homelab repository ##

    # TODO: Change to builtin git task
    - name: Git clone homelab
      register: git_clone_homelab
      changed_when: "'CHANGED' in git_clone_homelab.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if [ ! -e "$HOME/git/homelab" ]; then
          mkdir -p "$HOME/git"
          git clone 'https://github.com/matejkosiarcik/homelab.git' "$HOME/git/homelab"
          printf 'CHANGED\n'
        fi

    - name: Setup current server symlink
      register: git_current_symlink
      changed_when: "'CHANGED' in git_current_symlink.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        # Make sure current server directory exists
        if [ ! -d "$HOME/git/homelab/servers/$(uname -n)" ]; then
          exit 1
        fi

        # Create symlink
        if [ -e "$HOME/git/homelab/servers/.current" ]; then
          exit 0
        fi

        ln -s "$(uname -n)" "$HOME/git/homelab/servers/.current"
        printf 'CHANGED\n'

        if [ ! -e "$HOME/git/homelab/servers/.current/Taskfile.yml" ]; then
          exit 1
        fi

    - name: Update homelab repository
      register: update_git_homelab
      changed_when: "'CHANGED' in update_git_homelab.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        if [ -d "$HOME/git/homelab" ]; then
          cd "$HOME/git/homelab"
        else
          printf 'Directory ~/git/homelab not found\n'
          exit 1
        fi

        if [ "$(git branch --show-current)" != main ]; then
          git checkout main
          printf 'CHANGED\n'
        fi

        if [ "$(git status --short)" != '' ]; then
          git checkout .
          git clean -df
          printf 'CHANGED\n'
        fi

        if [ "$(git status --short)" != '' ]; then
          git checkout .
          git clean -df
          printf 'CHANGED\n'
        fi

        git fetch

        if [ "$(git diff --name-only origin/main)" != '' ]; then
          git pull --ff-only
          printf 'CHANGED\n'
        fi

    - name: Install server-wide utils
      register: server_install
      changed_when: "'CHANGED' in server_install.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        cd "$HOME/git/homelab/servers/.current"
        before_sha="$( (find "$HOME/config" -type f -exec shasum {} \; 2>/dev/null ; crontab -l) | shasum)"

        task install

        after_sha="$( (find "$HOME/config" -type f -exec shasum {} \; 2>/dev/null ; crontab -l) | shasum)"
        if [ "$before_sha" != "$after_sha" ]; then
          printf 'CHANGED\n'
        fi

    - name: Reboot
      when: server_install.changed
      throttle: 1
      ansible.builtin.reboot:
        reboot_command: sudo reboot

    - name: Sync secrets
      register: sync_secrets
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../secrets/{{ item.file }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/git/homelab/secrets/{{ item.file }}"
      loop:
        - file: ".sops.yml"
        - file: "key.txt"
        - file: "secrets.enc.yml"

    - name: Update secrets
      register: update_secrets
      when: sync_secrets.changed
      changed_when: "'CHANGED' in update_secrets.stdout"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "$HOME/.profile"

        cd "$HOME/git/homelab/servers/.current"
        before_sha="$(find . -path "./docker-apps/*/app-secrets/*" -type f -exec shasum {} \; 2>/dev/null | shasum)"

        task secrets

        after_sha="$(find . -path "./docker-apps/*/app-secrets/*" -type f -exec shasum {} \; 2>/dev/null | shasum)"
        if [ "$before_sha" != "$after_sha" ]; then
          printf 'CHANGED\n'
        fi
