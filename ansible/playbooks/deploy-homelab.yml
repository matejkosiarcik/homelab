- name: Deploy latest homelab services
  hosts: servers
  tasks:
    - name: Ping
      ansible.builtin.ping:

    - name: Locate Bash
      register: bash_path
      changed_when: false
      ansible.builtin.shell: |
        set -euf
        command -v bash

    - name: Test Bash path
      register: test_bash_path
      changed_when: false
      args:
        executable: "{{ bash_path.stdout }}"
      ansible.builtin.shell: |
        set -euf
        true

    - name: Install global server scripts
      register: install
      changed_when: "'CHANGED' in install.stdout"
      args:
        executable: "{{ bash_path.stdout }}"
        chdir: "{{ ansible_facts['env']['HOME'] }}/git/homelab/servers/.current"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "${HOME}/.profile"

        tmpdir="$(mktemp -d)"

        crontab -l | shasum >>"${tmpdir}/shasum-before.txt"
        sudo find /root/config -type f -exec shasum {} \; >>"${tmpdir}/shasum-before.txt"
        find "${HOME}/config" -type f -exec shasum {} \; >>"${tmpdir}/shasum-before.txt"

        task --taskfile './Taskfile.yml' install

        crontab -l | shasum >>"${tmpdir}/shasum-after.txt"
        sudo find /root/config -type f -exec shasum {} \; >>"${tmpdir}/shasum-after.txt"
        find "${HOME}/config" -type f -exec shasum {} \; >>"${tmpdir}/shasum-after.txt"

        if ! cmp --silent "${tmpdir}/shasum-before.txt" "${tmpdir}/shasum-after.txt"; then
          printf 'CHANGED\n'
        fi
        rm -rf "${tmpdir}"

    - name: Reboot
      when: install.changed
      throttle: 1
      ansible.builtin.reboot:
        reboot_command: sudo reboot

    - name: Deploy homelab
      register: deploy
      changed_when: "'CHANGED' in deploy.stdout"
      args:
        executable: "{{ bash_path.stdout }}"
        chdir: "{{ ansible_facts['env']['HOME'] }}/git/homelab/servers/.current"
      ansible.builtin.shell: |
        set -eufo pipefail
        source "${HOME}/.profile"

        # Define portable datetime format
        date_supports_milliseconds="$(date '+%3N')"
        case "${date_supports_milliseconds}" in
        [0-9][0-9][0-9]) milliseconds_format="%3N" ;;
        *) milliseconds_format="000" ;;
        esac
        datetime_format="+%Y-%m-%dT%H:%M:%S.${milliseconds_format}Z"

        log() {
          # $1 - log level
          # $2+ - message

          log_level="${1}"
          shift
          log_timestamp="$(date "${datetime_format}")"
          printf '%s\n' "${*}" | while IFS= read -r log_message; do
            printf '%s [%s]: %s\n' "${log_timestamp}" "${log_level}" "${log_message}"
          done >&2
        }

        if [ "$(git status --short)" != '' ]; then
          log ERROR 'git repository is dirty'
          git status
          exit 1
        fi

        task --taskfile './Taskfile.yml' deploy -- --prod
        printf 'CHANGED\n'
