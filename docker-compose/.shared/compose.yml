x-definitions: {}

services:
  # This template should only be used for services which need host network
  template_no_network:
    build:
      args:
        GID: ${DOCKER_COMPOSE_GID}
        HOMELAB_APP_EXTERNAL_DOMAIN: ${DOCKER_COMPOSE_NETWORK_DOMAIN}
        HOMELAB_APP_EXTERNAL_IP: ${DOCKER_COMPOSE_NETWORK_IP}
        HOMELAB_APP_EXTERNAL_URL: ${DOCKER_COMPOSE_NETWORK_URL}
        HOMELAB_APP_FULLNAME: ${DOCKER_COMPOSE_APP_FULLNAME}
        HOMELAB_APP_SHORTNAME: ${DOCKER_COMPOSE_APP_SHORTNAME}
        HOMELAB_APP_TYPE: ${DOCKER_COMPOSE_APP_TYPE}
        HOMELAB_BUILD_ENV: ${DOCKER_COMPOSE_ENV}
        HOMELAB_ENV: ${DOCKER_COMPOSE_ENV}
        UID: ${DOCKER_COMPOSE_UID}
      context: ${DOCKER_COMPOSE_REPOROOT_PATH}/
      dockerfile: ./docker-images/PLACEHOLDER/Dockerfile
    cap_drop:
      - ALL
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-PLACEHOLDER
    dns_opt:
      - single-request
    environment:
      HOMELAB_APP_EXTERNAL_DOMAIN: ${DOCKER_COMPOSE_NETWORK_DOMAIN}
      HOMELAB_APP_EXTERNAL_IP: ${DOCKER_COMPOSE_NETWORK_IP}
      HOMELAB_APP_EXTERNAL_URL: ${DOCKER_COMPOSE_NETWORK_URL}
      HOMELAB_APP_FULLNAME: ${DOCKER_COMPOSE_APP_FULLNAME}
      HOMELAB_APP_SHORTNAME: ${DOCKER_COMPOSE_APP_SHORTNAME}
      HOMELAB_APP_TYPE: ${DOCKER_COMPOSE_APP_TYPE}
      HOMELAB_ENV: ${DOCKER_COMPOSE_ENV}
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-PLACEHOLDER:latest
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1777 # TODO: Restrict the mode further

  # General purpose service template
  template:
    extends:
      service: template_no_network
    # Override:
    networks:
      - internal-network
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
      net.ipv6.conf.all.disable_ipv6: 1
    userns_mode: host # TODO: Remove this

  app:
    extends:
      service: template
    # Override:
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-app
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-app:latest

  certificator:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/certificator/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-certificator
    dns: # Use internal DNS
      - 10.1.12.6
      - 10.1.10.6
    env_file:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/certificator.env
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-certificator:latest
    networks:
      - external-network
      - internal-network
    tmpfs:
      - /homelab/tmpfs:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/certs:/homelab/certs:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/certificator/cron:/homelab/logs/cron:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/certificator/healthcheck:/homelab/logs/healthcheck:rw

  apache:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/apache/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-apache
    dns: # Use blackhole DNS
      - 10.1.12.7
      - 10.1.10.7
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-apache:latest
    networks:
      - external-network # TODO: Connect to external world via socat instead
      - internal-network
    tmpfs:
      - /var/lock:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
      - /var/log/apache2:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
      - /var/run/apache2:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/certs:/homelab/certs:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/apache/default:/homelab/logs/apache:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/apache/healthcheck:/homelab/logs/healthcheck:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/proxy-prometheus.htpasswd:/homelab/users/proxy-prometheus.htpasswd:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/proxy-status.htpasswd:/homelab/users/proxy-status.htpasswd:ro

  apache-prometheus-exporter:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/apache-prometheus-exporter/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-apache-prometheus-exporter
    env_file:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/apache-prometheus-exporter.env
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-apache-prometheus-exporter:latest
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/apache-prometheus-exporter/healthcheck:/homelab/logs/healthcheck:rw

  docker-sockguard:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/docker-sockguard/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-docker-sockguard
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-docker-sockguard:latest
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/docker-sockguard/healthcheck:/homelab/logs/healthcheck:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/mtls/docker-socket-proxy/server/ca.crt:/homelab/tls-certs/client/docker-socket-proxy/ca.pem:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/mtls/sockguard/client/docker-socket-proxy/client.crt:/homelab/tls-certs/client/docker-socket-proxy/cert.pem:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/mtls/sockguard/client/docker-socket-proxy/client.key:/homelab/tls-certs/client/docker-socket-proxy/key.pem:ro

  docker-socket-proxy:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/docker-socket-proxy/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-docker-socket-proxy
    group_add:
      - "${DOCKER_COMPOSE_DOCKER_GID}"
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-docker-socket-proxy:latest
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/docker-socket-proxy/healthcheck:/homelab/logs/healthcheck:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/mtls/docker-socket-proxy/server/server.crt:/homelab/tls-certs/server/server.crt:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/mtls/docker-socket-proxy/server/server.key:/homelab/tls-certs/server/server.key:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/mtls/sockguard/client/docker-socket-proxy/ca.crt:/homelab/tls-certs/server/client-ca.crt:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  docker-app-setup:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/docker-setup/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-app-setup
    environment:
      DOCKER_HOST: tcp://docker-sockguard:2375
      HOMELAB_SETUP_TARGET_CONTAINER: ${DOCKER_COMPOSE_APP_SHORTNAME}-app
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-app-setup:latest
    tmpfs:
      - /homelab/tmpfs:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/docker-app-setup/healthcheck:/homelab/logs/healthcheck:rw

  favicons:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/favicons/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-favicons
    env_file:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/favicons.env
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-favicons:latest
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/favicons/default:/homelab/logs/default:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/favicons/healthcheck:/homelab/logs/healthcheck:rw

  file-server:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/file-server/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-file-server
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-file-server:latest
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/file-server/default:/homelab/logs/default:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/file-server/healthcheck:/homelab/logs/healthcheck:rw

  script-app-setup:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/script-setup/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-app-setup
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-app-setup:latest
    tmpfs:
      - /homelab/tmpfs:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/script-app-setup/healthcheck:/homelab/logs/healthcheck:rw

  redis:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/redis/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-redis
    env_file:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/redis.env
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-redis:latest
    tmpfs:
      - /homelab/tmpfs:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/redis/certs:/homelab/redis-certs:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/redis/data:/data:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/redis/healthcheck:/homelab/logs/healthcheck:rw

  postgres:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/postgres/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-postgres
    env_file:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/postgres.env
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-postgres:latest
    shm_size: 1G
    tmpfs:
      - /var/run:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/postgres/data:/var/lib/postgresql/data:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/postgres/healthcheck:/homelab/logs/healthcheck:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/postgres.crt:/homelab/certs/postgres.crt:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/postgres.key:/homelab/certs/postgres.key:ro

  postgis:
    extends:
      service: template
    # Override:
    build:
      dockerfile: ./docker-images/postgis/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-postgis
    env_file:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/postgis.env
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-postgis:latest
    shm_size: 1G
    tmpfs:
      - /var/run:rw,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1700
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/postgis/data:/var/lib/postgresql/data:rw
      # - ${DOCKER_COMPOSE_APP_PATH}/app-data/dawarich/shared:/var/shared:rw # TODO: Determine if necessary
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/postgis/healthcheck:/homelab/logs/healthcheck:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/postgres.crt:/homelab/certs/postgres.crt:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/postgres.key:/homelab/certs/postgres.key:ro
