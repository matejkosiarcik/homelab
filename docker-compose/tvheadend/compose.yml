x-definitions: {}

name: ${DOCKER_COMPOSE_APP_SHORTNAME}

services:
  app:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: app
    # Override:
    build:
      dockerfile: ./docker-images/tvheadend/Dockerfile
    dns: # Use blackhole DNS
      - 10.1.12.7
      - 10.1.10.7
    init: false # Can't run with PID other than 1
    networks:
      - external-network
      - internal-network
    tmpfs:
      - /app:rw,async,noexec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1777 # TODO: Restrict the mode further
      - /run:rw,async,exec,nosuid,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},mode=1777 # TODO: Restrict the mode further
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/app/data:/config:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/app/healthcheck:/homelab/logs/healthcheck:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/app/recordings:/recordings:rw
      - ${DOCKER_COMPOSE_APP_PATH}/config/groupadd.txt:/groupadd:ro

  certificator:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: certificator

  apache:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: apache

  apache-prometheus-exporter:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: apache-prometheus-exporter

  favicons:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: favicons

networks:
  default:
    driver: none
  external-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-external-network
    driver: bridge
    internal: false
  internal-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-internal-network
    driver: bridge
    internal: true
