app:
  name: Crossroad

apache:
  upstream-url:
    - path: /
      target: http://app:3000

favicons:
  default: /icons/favicon/favicon.png
  # ico: /icons/favicon/favicon.ico

gatus:
  enabled: true

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
