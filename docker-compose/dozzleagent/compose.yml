x-definitions: {}

name: ${DOCKER_COMPOSE_APP_SHORTNAME}

services:
  app:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: app
    # Override:
    build:
      dockerfile: ./docker-images/dozzle/Dockerfile
    command: agent
    depends_on:
      docker-sockguard:
        condition: service_healthy
    dns: # Use blackhole DNS
      - 10.1.12.7
      - 10.1.10.7
    environment:
      DOCKER_HOST: tcp://docker-sockguard:2375
      DOZZLE_HOSTNAME: ${DOCKER_COMPOSE_SERVER_NAME-Unknown}
    networks:
      - external-network
      - internal-network
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/app/healthcheck:/homelab/logs/healthcheck:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/dozzle-cert.pem:/certs/dozzle-cert.pem:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/dozzle-key.pem:/certs/dozzle-key.pem:ro
      # Docker socket intentionally left out, as we are using docker-sockguard and docker-socket-proxy

  docker-sockguard:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: docker-sockguard
    # Override:
    environment:
      SOCKGUARD_INSECURE_ALLOW_READ_EXFILTRATION: "true" # Required for container log streaming

  docker-socket-proxy:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: docker-socket-proxy
    # Override:
    environment:
      ALLOW_LOGS: 1
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      PING: 1

  certificator:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: certificator

  apache:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: apache
    # Override:
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/docker-sockguard-prometheus.htpasswd:/homelab/users/docker-sockguard-prometheus.htpasswd:ro

  apache-prometheus-exporter:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: apache-prometheus-exporter

  favicons:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: favicons

  file-server:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: file-server
    # Override:
    build:
      args:
        HOMELAB_COPY_PATH_1_SRC: "./docker-images/dozzle/agent/icons/"
        HOMELAB_COPY_PATH_1_DEST: ""

networks:
  default:
    driver: none
  external-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-external-network
    driver: bridge
    internal: false
  internal-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-internal-network
    driver: bridge
    internal: true
