x-definitions: {}

services:
  app:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: app
    # Override:
    build:
      dockerfile: ./docker-images/dozzle/Dockerfile
    command: agent
    depends_on:
      docker-proxy-filter:
        condition: service_healthy
    dns: # Use blackhole DNS
      - 10.1.12.7
      - 10.1.10.7
    environment:
      DOZZLE_HOSTNAME: ${DOCKER_COMPOSE_SERVER_NAME-Unknown}
      DOCKER_HOST: tcp://docker-proxy-filter:2375
    networks:
      - external-network
      - internal-network
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/app/healthcheck:/homelab/logs/healthcheck:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/dozzle-cert.pem:/certs/dozzle-cert.pem:ro
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/dozzle-key.pem:/certs/dozzle-key.pem:ro
      # Docker socket intentionally left out, as we are using docker-proxy-filter and docker-socket-proxy

  docker-proxy-filter:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: docker-proxy-filter
    # Override:
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    environment:
      CONTAINER_LABELS: "" # Allow all containers
      CONTAINER_NAMES: "" # Allow all containers

  docker-socket-proxy:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: docker-socket-proxy
    # Override:
    environment:
      ALLOW_LOGS: 1
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      PING: 1

networks:
  default:
    driver: none
  external-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-external-network
    driver: bridge
    internal: false
  internal-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-internal-network
    driver: bridge
    internal: true
