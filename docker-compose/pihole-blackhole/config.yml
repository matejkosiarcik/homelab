app:
  name: PiHole [blackhole]

apache:
  upstream-url:
    - path: /metrics
      target: http://app-prometheus-exporter:9617/metrics
    - path: /
      target: http://app:80

gatus:
  enabled: true
  type: [dns, http]
  endpoints:
    - path: /metrics
      authentication:
        basic: prometheus

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
    - path: /metrics
      auth:
        type: basic
