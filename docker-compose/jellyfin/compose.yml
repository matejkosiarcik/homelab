x-definitions: {}

services:
  app:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: app
    # Override:
    build:
      dockerfile: ./docker-images/jellyfin/Dockerfile
    dns: # Use internal DNS
      - 10.1.12.6
      - 10.1.10.6
    environment:
      JELLYFIN_PublishedServerUrl: ${DOCKER_COMPOSE_NETWORK_URL}
    hostname: ${DOCKER_COMPOSE_APP_FULLNAME} # This fixes random container hostname in settings and server picker (everything after dot is ignored, so it cannot be full domain)
    networks: # External network necessary to connect to media storage and Tvheadend
      - external-network
      - internal-network
    tmpfs:
      - /cache:rw,noexec,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID}
      - /tmp/jellyfin:rw,noexec,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID},size=4G
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/app/data:/config:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/app/default:/logs:rw
      - ${DOCKER_COMPOSE_APP_PATH}/app-logs/app/healthcheck:/homelab/healthcheck/logs:rw

  app-setup:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: script-app-setup
    # Override:
    build:
      args:
        SETUP_SCRIPT_DIR: jellyfin
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-data/app/data:/homelab/data:rw

  certificator:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: certificator

  apache:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: apache
    # Override:
    volumes:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/prometheus.htpasswd:/homelab/users/prometheus.htpasswd:ro

  apache-prometheus-exporter:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: apache-prometheus-exporter

  favicons:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: favicons

networks:
  default:
    driver: none
  external-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-external-network
    driver: bridge
    internal: false
  internal-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-internal-network
    driver: bridge
    internal: true
