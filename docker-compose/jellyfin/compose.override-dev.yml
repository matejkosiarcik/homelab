x-definitions:
  common-service-options: &common-service-options
    restart: "no"

services:
  app:
    <<: *common-service-options
    environment:
      JELLYFIN_PublishedServerUrl: ${DOCKER_COMPOSE_NETWORK_URL}
    # ports:
    #   - 127.0.0.1:7359:7359/udp # Autodiscovery - turned off for now

  app-setup:
    <<: *common-service-options

  certificator:
    <<: *common-service-options

  apache:
    <<: *common-service-options
    ports:
      - 127.0.0.1:8080:80
      - 127.0.0.1:8096:80
      - 127.0.0.1:8443:443

  apache-prometheus-exporter:
    <<: *common-service-options

  favicons:
    <<: *common-service-options
