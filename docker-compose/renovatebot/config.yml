app:
  name: Renovatebot

apache:
  upstream-url:
    - path: /
      target: http://app:8080

gatus:
  enabled: true
  authentication:
    basic: homelab-viewer

healthchecks:
  - slug: certificator
  - slug: app
    cron: "00 01 * * *"

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
