app:
  name: Renovatebot

apache:
  upstream-url:
    - path: /runwisp/
      target: http://app:8080/runwisp
    - path: /
      target: http://file-server:8080

favicons:
  default: "/favicon.png"

gatus:
  enabled: true
  authentication:
    basic: homelab-viewer

healthchecks:
  - slug: certificator
  - slug: app
    schedule: "0 1,3,5 * * *"

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
    - path: /runwisp/metrics
      auth:
        type: basic
