app:
  name: HomeAssistant

apache:
  upstream-url:
    - path: /
      target: http://app:8123

favicons:
  default: /static/icons/favicon-192x192.png
  # ico: /static/icons/favicon.ico

gatus:
  enabled: true
  endpoints:
    - path: /api/prometheus
      authentication:
        bearer: PROMETHEUS_TOKEN

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
    - path: /api/prometheus
      auth:
        type: bearer
