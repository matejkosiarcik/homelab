app:
  name: Koffan

apache:
  upstream-url:
    - path: /
      target: http://app:8080

favicons:
  default: /static/icon-192.png
  # ico: /favicon.ico

gatus:
  enabled: true

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
