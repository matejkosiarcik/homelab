app:
  name: ActualBudget

apache:
  upstream-url:
    - path: /
      target: http://app:5006

favicons:
  default: /apple-touch-icon.png
  # ico: /favicon.ico

gatus:
  enabled: true

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
