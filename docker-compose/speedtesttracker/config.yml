app:
  name: SpeedTestTracker

apache:
  upstream-url:
    - path: /
      target: https://app:443

gatus:
  enabled: true
  endpoints:
    - path: /api/healthcheck
      conditions:
        - "[CONNECTED] == true"
        - "[STATUS] == 200"
        - "has([BODY].message) == true"

healthchecks:
  - slug: certificator
  - slug: app
    schedule: "15 */4 * * *"

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
