app:
  name: Data Optimizer

apache:
  upstream-url:
    - path: /
      target: http://app:8080 # This is just a temporary placeholder

gatus:
  enabled: true
  # TODO: Finish gatus config

healthchecks:
  - slug: certificator
  - slug: app
    schedule: "0 */4 * * *"

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
