app:
  name: Dawarich

apache:
  upstream-url:
    - path: /metrics
      target: http://app:9394/metrics
    # - path: /api/v1/owntracks/points
    #   target: http://decryptor:8080/api/v1/owntracks/points
    # - path: /pub
    #   target: http://decryptor:8080/pub
    - path: /
      target: http://app:3000

gatus:
  enabled: true
  endpoints:
    - path: /metrics
      authentication:
        basic: prometheus

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
    - path: /metrics
      auth:
        type: basic
