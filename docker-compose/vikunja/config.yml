app:
  name: Vikunja

apache:
  upstream-url:
    - path: /
      target: http://app:3456

favicons:
  default: /images/icons/apple-touch-icon-180x180.png
  # ico: /favicon.ico

gatus:
  enabled: false
  endpoints:
    - path: /api/v1/metrics

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
