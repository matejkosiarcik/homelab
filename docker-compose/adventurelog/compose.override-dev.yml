x-definitions:
  common-service-options: &common-service-options
    restart: "no"

services:
  app-frontend:
    <<: *common-service-options

  app-backend:
    <<: *common-service-options
    # Internet access required for downloading initial geo data
    environment:
      DISABLE_REGISTRATION: "False"

  postgis:
    <<: *common-service-options

  certificator:
    <<: *common-service-options

  apache:
    <<: *common-service-options
    ports:
      - 127.0.0.1:8080:80
      - 127.0.0.1:8443:443

  apache-prometheus-exporter:
    <<: *common-service-options

  favicons:
    <<: *common-service-options
