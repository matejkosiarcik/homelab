app:
  name: AdventureLog

apache:
  upstream-url:
    - path: /api/
      target: http://app-backend:80
    - path: /
      target: http://app-frontend:3000

gatus:
  enabled: true

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
