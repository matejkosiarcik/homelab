app:
  name: Kiwix

apache:
  upstream-url:
    - path: /
      target: http://app:8080

favicons:
  default: /skin/favicon/apple-touch-icon.png
  # ico: /skin/favicon/favicon-32x32.png

gatus:
  enabled: false
  authentication:
    basic: homelab-viewer

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
