app:
  name: DockerStats - <<server>>

apache:
  upstream-url:
    - path: /docker-sockguard/metrics
      target: http://docker-sockguard:2375/metrics
    - path: /metrics
      target: http://app:9487
    - path: /
      target: http://file-server:8080

favicons:
  default: "@dockerstats.png"

gatus:
  enabled: true
  authentication:
    basic: homelab-viewer
  endpoints:
    - path: /docker-sockguard/metrics
      authentication:
        basic: prometheus
    - path: /metrics
      authentication:
        basic: prometheus

healthchecks:
  - slug: certificator

prometheus:
  enabled: true
  endpoints:
    - path: /.apache/metrics
      auth:
        type: basic
    - path: /docker-sockguard/metrics
      auth:
        type: basic
    - path: /metrics
      auth:
        type: basic
