x-definitions: {}

services:
  novnc:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: app
    # Override:
    build:
      dockerfile: ./docker-images/novnc/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-novnc
    env_file:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/novnc.env
    environment:
      VNC_SERVER: wayvnc:5900
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-novnc:1.0.0
    networks:
      - external-network
      - internal-network

  wayvnc:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: app
    # Override:
    build:
      dockerfile: ./docker-images/wayvnc/Dockerfile
    container_name: ${DOCKER_COMPOSE_APP_SHORTNAME}-wayvnc
    env_file:
      - ${DOCKER_COMPOSE_APP_PATH}/app-secrets/wayvnc.env
    image: ${DOCKER_COMPOSE_APP_SHORTNAME}-wayvnc:1.0.0
    tmpfs:
      - /homelab/tmpfs:rw,noexec,nodev,noatime,nodiratime,uid=${DOCKER_COMPOSE_UID},gid=${DOCKER_COMPOSE_GID}

  certificator:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: certificator

  apache:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: apache

  apache-prometheus-exporter:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: apache-prometheus-exporter

  favicons:
    extends:
      file: ${DOCKER_COMPOSE_REPOROOT_PATH}/docker-compose/.shared/compose.yml
      service: favicons

networks:
  default:
    driver: none
  external-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-external-network
    driver: bridge
    internal: false
  internal-network:
    name: ${DOCKER_COMPOSE_APP_SHORTNAME}-internal-network
    driver: bridge
    internal: true
