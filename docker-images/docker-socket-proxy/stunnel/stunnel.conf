foreground = yes
syslog = no
pid =
debug = warning

[docker-socket-proxy]
client = no
accept = 0.0.0.0:2375
connect = 127.0.0.1:2376
cert = /homelab/tls-certs/server/server.crt
key = /homelab/tls-certs/server/server.key
CAfile = /homelab/tls-certs/server/client-ca.crt
verifyChain = yes
requireCert = yes
sslVersionMin = TLSv1.3
