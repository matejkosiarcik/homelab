rules:
  - action: allow
    match:
      method: "HEAD,GET"
      path: "/_ping"
  - action: allow
    match:
      method: GET
      path: "/containers/json"
  - action: allow
    match:
      method: GET
      path: "/containers/*/stats"
  - action: deny
    match:
      method: "*"
      path: "/**"
