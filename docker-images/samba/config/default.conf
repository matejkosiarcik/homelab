[global]
    # General
    map to guest = bad user
    # Logging
    log file = /homelab/logs/samba/smbd.log
    max log size = 0
    log level = 1
    server role = standalone server
    # SMB version
    server min protocol = SMB3_11
    server max protocol = SMB3_11
    # Better authentication
    ntlm auth = ntlmv2-only
    # Ignore junk files
    veto files = /._*/.DS_Store/.AppleDouble/.Trashes/.Trash/.AppleDB/.AppleDesktop/.TemporaryItems/.localized/thumbs.db/Thumbs.db/.windows/.mac/
    delete veto files = yes
    hide files = /.zfs/
    # passdb backend = smbpasswd
    # smb passwd file = /homelab/tmpfs/samba/smbpasswd
    # lock directory = /homelab/tmpfs/samba
    # state directory = /homelab/tmpfs/samba
    # cache directory = /homelab/tmpfs/samba
    # pid directory = /homelab/tmpfs/samba
    # private dir = /homelab/tmpfs/samba
    # ncalrpc dir = /homelab/tmpfs/samba

[#smb-title#]
    path = /data/
    read only = no
    browseable = yes
    writeable = yes
    guest ok = no
    # Permitted users
    valid users = #smb-user#
    write list = #smb-user#
    admin users = #smb-user#
    # Force correct owner and permissions on disk
    force user = homelab
    force group = homelab
    inherit owner = yes
    create mask = 0664
    directory mask = 0775
