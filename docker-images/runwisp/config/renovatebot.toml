[daemon]
metrics_enabled  = true
shutdown_timeout = "30s"
timezone         = "Europe/Bratislava"
external_url     = "${HOMELAB_APP_EXTERNAL_URL}/runwisp"

[defaults]
keep_for     = "90d"
keep_runs    = 100
log_max_size = "20mb"
log_on_full  = "drop_old"

[tasks.renovate]
catch_up      = 1
cron          = "0 1,3,5 * * *"
description   = "Run Renovate dependency updates"
env           = { CRON = "1" }
graceful_stop = "30s"
jitter        = "1m"
on_overlap    = "skip"
run           = "docker exec --env 'CRON' --user 'homelab' \"${HOMELAB_APP_SHORTNAME}-app\" sh '/homelab/cron-wrapper.sh'"
timeout       = "30m"
