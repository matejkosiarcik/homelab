title: Xiaomi TV Box

views:
  - title: Xiaomi TV Box
    path: home
    subview: true
    back_path: /dashboard-devices/home
    cards:
      - type: entities
        title: Xiaomi TV Box
        # show_header_toggle: false
        entities:
          - entity: remote.living_room_xiaomi_tv_box

      - type: entities
        title: Xiaomi TV Box
        # show_header_toggle: false
        entities:
          - entity: media_player.living_room_xiaomi_tv_box

      - type: markdown
        content: "## Remote"
      - type: grid
        columns: 4
        square: false
        cards:
          - type: button
            name: Power
            icon: mdi:power
            tap_action:
              action: perform-action
              perform_action: script.xiaomi_tv_box_button_power
          - type: button
            name: Home
            icon: mdi:home
            tap_action:
              action: perform-action
              perform_action: script.xiaomi_tv_box_button_home
          - type: button
            name: Back
            icon: mdi:arrow-left
            tap_action:
              action: perform-action
              perform_action: script.xiaomi_tv_box_button_back
          - type: button
            name: Assistant
            icon: mdi:microphone
            tap_action:
