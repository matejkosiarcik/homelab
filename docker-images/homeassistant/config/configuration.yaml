lovelace:
  mode: storage
  dashboards:
    dashboard-devices:
      mode: yaml
      title: Devices
      icon: mdi:television
      show_in_sidebar: true
      filename: custom/dashboard-devices.yaml
    dashboard-living-room-xiaomi-tv-box:
      mode: yaml
      title: Xiaomi TV Box
      icon: mdi:television
      show_in_sidebar: false
      filename: custom/dashboard-living_room-xiaomi_tv_box.yaml

script:
  # Android TV Remote's documented key-command catalog. Some TV-specific keys
  # depend on the active app and Xiaomi firmware, but are exposed individually
  # so they can also be used in automations.
  xiaomi_tv_box_button_dpad_up:
    alias: Xiaomi TV Box - Button Up
    icon: mdi:arrow-up-bold
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.living_room_xiaomi_tv_box
        data:
          command: DPAD_UP
  xiaomi_tv_box_button_dpad_down:
