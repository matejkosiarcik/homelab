# Custom Apache configuration

ServerName ${HOMELAB_APP_EXTERNAL_DOMAIN}
UseCanonicalName On
DocumentRoot /homelab/www
ServerTokens Prod
TraceEnable off
FileETag None
ServerSignature off
DirectoryIndex disabled
Options -Indexes -ExecCGI -Includes -FollowSymLinks -MultiViews
AcceptPathInfo off
DirectorySlash off
User homelab
Group homelab

# This service is a reverse proxy only. Do not accept requests asking it to
# fetch arbitrary remote resources, and do not pass client-controlled
# forwarding headers through to applications.
ProxyRequests Off
ProxyAddHeaders Off

# Bound the time spent reading an incomplete request. The minimum rate keeps
# legitimate slow uploads working while limiting Slowloris-style connections.
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

# Logging
LogLevel error
ErrorLog /homelab/logs/apache/generic-error.log
CustomLog /homelab/logs/apache/generic-access.log combined
# ForensicLog /homelab/logs/apache/generic-forensic.log

# Common TLS Settings
SSLProtocol -all -SSLv3 -TLSv1 -TLSv1.1 -TLSv1.2 +TLSv1.3
# SSLCipherSuite RC4-SHA:AES128-SHA:HIGH:!aNULL:!MD5
SSLCompression off
SSLOptions +StrictRequire
SSLSessionTickets off
# SSLUseStapling on
# SSLStaplingCache "shmcb:logs/ssl_stapling(32768)"

SSLProxyEngine on
SSLProxyVerify none
SSLProxyCheckPeerCN off
SSLProxyCheckPeerName off
SSLProxyCheckPeerExpire off
SetEnv proxy-sendcl 1
SetEnv proxy-sendchunked 0
ProxyStatus on
ProxyPreserveHost on
# ProxyRequests off
# ProxyErrorOverride off

# Setup for mod_status
ExtendedStatus On

# Remove html response for redirects
# Ideally it would be completely empty, but very-short response is the best I can do for now
ErrorDocument 301 "Redirect 301"
ErrorDocument 302 "Redirect 302"
ErrorDocument 303 "Redirect 303"
ErrorDocument 307 "Redirect 307"
ErrorDocument 308 "Redirect 308"

# Custom error pages
ErrorDocument 400 /.apache/errors/400/index.html
ErrorDocument 401 /.apache/errors/401/index.html
ErrorDocument 402 /.apache/errors/402/index.html
ErrorDocument 403 /.apache/errors/403/index.html
ErrorDocument 404 /.apache/errors/404/index.html
ErrorDocument 405 /.apache/errors/405/index.html
ErrorDocument 406 /.apache/errors/406/index.html
ErrorDocument 407 /.apache/errors/407/index.html
ErrorDocument 408 /.apache/errors/408/index.html
ErrorDocument 409 /.apache/errors/409/index.html
ErrorDocument 410 /.apache/errors/410/index.html
ErrorDocument 411 /.apache/errors/411/index.html
ErrorDocument 412 /.apache/errors/412/index.html
ErrorDocument 413 /.apache/errors/413/index.html
ErrorDocument 414 /.apache/errors/414/index.html
ErrorDocument 415 /.apache/errors/415/index.html
ErrorDocument 416 /.apache/errors/416/index.html
ErrorDocument 417 /.apache/errors/417/index.html
# ErrorDocument 418 /.apache/errors/418/index.html # Throws error
ErrorDocument 421 /.apache/errors/421/index.html
ErrorDocument 422 /.apache/errors/422/index.html
ErrorDocument 423 /.apache/errors/423/index.html
ErrorDocument 424 /.apache/errors/424/index.html
# ErrorDocument 425 /.apache/errors/425/index.html # Throws error
ErrorDocument 426 /.apache/errors/426/index.html
ErrorDocument 428 /.apache/errors/428/index.html
ErrorDocument 429 /.apache/errors/429/index.html
ErrorDocument 431 /.apache/errors/431/index.html
ErrorDocument 451 /.apache/errors/451/index.html
ErrorDocument 500 /.apache/errors/500/index.html
ErrorDocument 501 /.apache/errors/501/index.html
ErrorDocument 502 /.apache/errors/502/index.html
ErrorDocument 503 /.apache/errors/503/index.html
ErrorDocument 504 /.apache/errors/504/index.html
ErrorDocument 505 /.apache/errors/505/index.html
ErrorDocument 506 /.apache/errors/506/index.html
ErrorDocument 507 /.apache/errors/507/index.html
ErrorDocument 508 /.apache/errors/508/index.html
ErrorDocument 510 /.apache/errors/510/index.html
ErrorDocument 511 /.apache/errors/511/index.html

<Directory "/homelab/www">
    # Options -Indexes -ExecCGI -Includes -FollowSymLinks -MultiViews +SymLinksIfOwnerMatch
    # AllowOverride None
    AllowOverride All
    Require all granted
</Directory>

<Location "/.apache/">
    DirectoryIndex index.html
</Location>

<Macro CommonSecuritySettings>
    Header unset Server
    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # TODO: The Header "Access-Control-Allow-Origin"not be necessary:
    # Do not set a blanket Access-Control-Allow-Origin value here. Upstreams
    # that need cross-origin access must explicitly allow their trusted origins.
    Header always set Access-Control-Allow-Origin "*"
</Macro>

<Macro CommonProxySettings>
    # Main proxy config. This macro is intentionally used only by the HTTPS
    # virtual host; the HTTP virtual host must never forward a request upstream.
    AllowEncodedSlashes NoDecode
    ProxyPreserveHost On

    # This proxy is the trust boundary for forwarding metadata. Discard any
    # values supplied by the client and construct trusted values instead.
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Port
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Forwarded-Ssl
    RequestHeader unset X-Url-Scheme
    RequestHeader unset HTTP_X_FORWARDED_PROTO
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    RequestHeader set X-Forwarded-Port "expr=%{SERVER_PORT}"
    RequestHeader set X-Forwarded-Host "expr=%{SERVER_NAME}"
    RequestHeader set Host "expr=%{SERVER_NAME}"

    # <<INSERT_EXTRA_REVERSE_PROXY>>

    # Can't override errors for all services, because it interferes with their own error handling and showing detailed error messages/toasts/etc
    ProxyErrorOverride Off
    Use CommonSecuritySettings

    # Handle status requests specially behind authentication
    <Location "/.apache/status">
        SetHandler server-status
        # Setup Basic Authentication
        AuthType Basic
        AuthName Protected
        AuthBasicProvider file
        AuthUserFile /homelab/users/proxy-status.htpasswd
        Require valid-user
    </Location>
</Macro>

<VirtualHost *:80>
    ServerAlias *
    # Keep response hardening on redirects, but never enable reverse-proxy
    # configuration in this virtual host.
    Use CommonSecuritySettings
    Protocols http/1.1

    ErrorLog /homelab/logs/apache/http-error.log
    CustomLog /homelab/logs/apache/http-access.log combined
    # ForensicLog /homelab/logs/apache/http-forensic.log

    # Disable compression for openspeedtest (ensure accurate results)
    SetEnvIfExpr "%{ENV:HOMELAB_APP_TYPE} == 'openspeedtest'" no-gzip=1
</VirtualHost>

<VirtualHost *:443>
    ServerAlias *
    Use CommonProxySettings
    Protocols h2 http/1.1

    ErrorLog /homelab/logs/apache/https-error.log
    CustomLog /homelab/logs/apache/https-access.log combined
    # ForensicLog /homelab/logs/apache/https-forensic.log

    # TLS settings
    SSLEngine on
    SSLCertificateFile /homelab/certs/fullchain.pem
    SSLCertificateKeyFile /homelab/certs/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"

    # These settings may be required in some upstreams (eg. healthchecks), see more: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Forwarded-Proto
    RequestHeader set HTTP_X_FORWARDED_PROTO https
    RequestHeader set X-Forwarded-Ssl on
    RequestHeader set X-Url-Scheme https

    # Disable compression for openspeedtest (ensure accurate results)
    SetEnvIfExpr "%{ENV:HOMELAB_APP_TYPE} == 'openspeedtest'" no-gzip=1
</VirtualHost>
