version: "3"
silent: true

tasks:
  build:
    desc: Build all apps
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 '{{.ROOT_DIR}}/../../../../utils/server-helpers/main.py' build {{.CLI_ARGS}}

  debug-compose:
    desc: Dump resolved compose configs for all apps
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 '{{.ROOT_DIR}}/../../../../utils/server-helpers/main.py' debug-compose {{.CLI_ARGS}}

  deploy:
    desc: Deploy all apps | build + stop + start
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 '{{.ROOT_DIR}}/../../../../utils/server-helpers/main.py' deploy {{.CLI_ARGS}}

  install:
    desc: Global server install
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 '{{.ROOT_DIR}}/../../../../utils/server-helpers/main.py' install {{.CLI_ARGS}}

  restart:
    desc: Restart all apps
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 '{{.ROOT_DIR}}/../../../../utils/server-helpers/main.py' restart {{.CLI_ARGS}}

  secrets:
    desc: Create new secrets for all apps
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 '{{.ROOT_DIR}}/../../../../utils/server-helpers/main.py' secrets {{.CLI_ARGS}}

  start:
    desc: Start all apps
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 '{{.ROOT_DIR}}/../../../../utils/server-helpers/main.py' start {{.CLI_ARGS}}

  stop:
    desc: Stop all apps
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - python3 '{{.ROOT_DIR}}/../../../../utils/server-helpers/main.py' stop {{.CLI_ARGS}}
