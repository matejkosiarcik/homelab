name: Raw Build

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-build:
    name: Native Build
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install APT dependencies
        run: |
          set -euf
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends --no-install-suggests apache2-utils moreutils

      - name: Setup NodeJS
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/setup-node@v7.0.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            node-version: latest

      - name: Setup Python
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/setup-python@v7.0.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            python-version: 3.x

      - name: Bootstrap dependencies
        run: |
          set -euf
          make bootstrap

      - name: Build
        run: |
          set -euf
          make build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    env:
      COMPOSE_BAKE: "true"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      DOCKER_BUILDKIT: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/setup-node@v7.0.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            node-version: latest

      - name: Setup Python
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/setup-python@v7.0.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            python-version: 3.x

      - name: Setup QEMU
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/setup-qemu-action@v4.3.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            cache-image: false

      - name: Setup Docker Buildx
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/setup-buildx-action@v4.3.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            version: latest
            cache-binary: false

      - name: Setup Docker Compose
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/setup-compose-action@v2.3.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            version: latest
            cache-binary: false

      - name: Install APT dependencies
        run: |
          set -euf
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends --no-install-suggests apache2-utils jq moreutils

      - name: Docker build
        uses: Wandalen/wretry.action@v3.8.0
        with:
          command: make docker-build
          attempt_limit: >-
            ${{ (
              (github.event_name == 'push' && github.ref == 'refs/heads/main')
              || (github.event_name == 'pull_request' && (
                github.event.pull_request.user.login == 'dependabot[bot]'
                || github.event.pull_request.user.login == 'renovate[bot]'
                || (github.event.pull_request.user.login == 'matejkosiarcik' && startsWith(github.head_ref, 'renovate/'))
              ))
            ) && 3 || 2 }}
          attempt_delay: 2500
