name: Docker build

permissions: {}

on:
  pull_request:

jobs:
  discovery:
    name: Discover docker apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Discover docker apps
        id: discovery
        run: |
          set -euf

          tmpfile="$(mktemp)"
          trap 'rm -f "$tmpfile"' EXIT HUP INT TERM

          find . -type d -path './servers/*/docker-apps/*' -mindepth 4 -maxdepth 4 | while read -r path; do
            server_name="$(basename "$(dirname "$(dirname "$path")")")"
            app_name="$(basename "$path")"
            app_label="$server_name - $app_name"
            app_path="$path"
            matrix_json="{\"path\":\"$app_path\",\"label\":\"$app_label\"},"
          done

          printf 'matrix=[%s]\n' "$(cat "$tmpfile" | sed 's~,$~~')" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build - ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: discovery
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discovery.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log
        run: |
          printf 'Building %s\n' "${{ matrix.label }}"
          if [ ! -d "${{ matrix.path }}" ]; then
            printf 'App %s not found.\n' ${{ matrix.path }}" >&2
            exit 1
          fi

      - name: Install APT dependencies
        run: sudo apt-get update && sudo apt-get install --yes moreutils

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.x

      - name: Setup NodeJS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: latest

      - name: Install system dependencies
        run: |
          set -euf
          sudo apt-get install --yes --no-install-recommends --no-install-suggests apache2-utils moreutils
          npm install -g @go-task/cli

      - name: Setup secrets
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        working-directory: ${{ matrix.path }}
        run: |
          task secrets -- --mode dev --offline

      - name: Docker build
        working-directory: ${{ matrix.path }}
        run: |
          task build -- --mode dev

      - name: Docker start
        working-directory: ${{ matrix.path }}
        run: |
          task start -- --mode dev --dry-run

      - name: Docker stop
        working-directory: ${{ matrix.path }}
        run: |
          task stop -- --mode dev --dry-run

  status:
    name: Aggregate build status
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - discovery
      - build
    steps:
      - name: Aggregate build status
        run: |
          printf 'Discovery: %s\n' "${{ needs.discovery.result }}"
          printf 'Build: %s\n' "${{ needs.build.result }}"

          if [ "${{ needs.discovery.result }}" != 'success' ]; then
            printf 'Discovery job failed or was cancelled.\n'
            exit 1
          fi

          if [ "${{ needs.build.result }}" != 'success' ]; then
            printf 'One or more matrix build jobs failed or was cancelled.\n'
            exit 1
          fi

          printf 'All docker app build jobs completed successfully.\n'
