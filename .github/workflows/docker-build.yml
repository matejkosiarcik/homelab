name: Docker Build

permissions: {}

on:
  pull_request:

jobs:
  discovery:
    name: Discover Docker Apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Discover docker apps
        id: discovery
        run: |
          set -euf

          tmpfile="$(mktemp)"
          trap 'rm -f "$tmpfile"' EXIT HUP INT TERM

          find . -type d -path './servers/*/docker-apps/*' -mindepth 4 -maxdepth 4 | while read -r path; do
            if basename "$path" | grep -qE '^\.' >/dev/null 2>&1; then
              continue
            fi
            server_name="$(basename "$(dirname "$(dirname "$path")")")"
            app_name="$(basename "$path")"
            app_label="$server_name - $app_name"
            printf '{"path":"%s","label":"%s"},' "$path" "$app_label" >>"$tmpfile"
          done

          printf 'matrix=[%s]\n' "$(cat "$tmpfile" | sed -E 's~,$~~')" | tee -a "$GITHUB_OUTPUT"

      - name: Show Docker versions
        run: |
          docker version
          docker compose version
          docker buildx version

  build:
    name: Docker Build - ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: discovery
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    env:
      COMPOSE_BAKE: "true"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      DOCKER_BUILDKIT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.discovery.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
        with:
          version: latest
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.path }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.path }}

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2.3.0
        with:
          version: latest

      - name: Install APT dependencies
        run: |
          set -euf
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends --no-install-suggests apache2-utils jq moreutils

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.x

      - name: Setup NodeJS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: latest

      - name: Install NodeJS dependencies
        run: |
          set -euf
          printf 'fetch-retries=5\nfetch-retry-factor=10\nfetch-retry-maxtimeout=60000\nfetch-retry-mintimeout=1000\nignore-scripts=true\nmin-release-age=1\n' >>"$HOME/.npmrc"
          NODE_OPTIONS=--dns-result-order=ipv4first npm install --unsafe-perm --no-progress --no-audit --no-fund --loglevel=error --prefer-offline --global @go-task/cli

      - name: Install Pip dependencies
        run: |
          set -euf
          python3 -m pip install yq

      - name: Setup secrets
        run: |
          set -euf
          task secrets -- --mode dev

      - name: Docker build
        run: |
          set -euf
          task build -- --mode dev

      - name: Docker start
        run: |
          set -euf
          task start -- --mode dev --dry-run

      - name: Docker stop
        run: |
          set -euf
          task stop -- --mode dev --dry-run

  status:
    name: Docker Build Status
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - discovery
      - build
    steps:
      - name: Aggregate build status
        run: |
          set -euf

          printf 'Discovery: %s\n' "${{ needs.discovery.result }}"
          printf 'Build: %s\n' "${{ needs.build.result }}"

          if [ "${{ needs.discovery.result }}" != 'success' ]; then
            printf 'Discovery job failed or was cancelled.\n'
            exit 1
          fi

          if [ "${{ needs.build.result }}" != 'success' ]; then
            printf 'One or more matrix build jobs failed or was cancelled.\n'
            exit 1
          fi

          printf 'All docker app build jobs completed successfully.\n'
